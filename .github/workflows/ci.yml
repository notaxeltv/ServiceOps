name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: serviceops
          POSTGRES_PASSWORD: serviceops
          POSTGRES_DB: serviceops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Generate Prisma client
        run: pnpm --filter @serviceops/api exec prisma generate
        env:
          DATABASE_URL: postgresql://serviceops:serviceops@localhost:5432/serviceops

      - name: Migrate database
        run: pnpm --filter @serviceops/api exec prisma db push
        env:
          DATABASE_URL: postgresql://serviceops:serviceops@localhost:5432/serviceops

      - name: Typecheck
        run: pnpm typecheck

      - name: Test API
        run: pnpm --filter @serviceops/api test
        env:
          DATABASE_URL: postgresql://serviceops:serviceops@localhost:5432/serviceops
          JWT_SECRET: test-secret

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t serviceops-api:ci .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t serviceops-web:ci .
